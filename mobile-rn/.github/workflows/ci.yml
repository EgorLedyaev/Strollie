name: CI

on:
    pull_request:
    push:
        branches: [master, main]

jobs:
    build-and-validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Cache npm directory
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      npm-cache-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Prettier check
              run: npm run format:check

            - name: ESLint (fail on warnings)
              run: npm run lint -- --max-warnings=100 # temporarily allow some warnings, to be fixed gradually

            - name: Type check
              run: npm run typecheck

            - name: FSD architecture
              run: npm run fsd:check

            # - name: Tests
            #   run: npm test -- --ci

    android-build:
        name: Android Build (prebuild + release APK)
        runs-on: ubuntu-latest
        needs: build-and-validate
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Cache npm directory
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      npm-cache-${{ runner.os }}-

            - name: Setup Java (Temurin 17)
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
                  cache: gradle

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      ~/.android/build-cache
                      android/.gradle
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      gradle-${{ runner.os }}-

            - name: Cache Expo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.expo
                      ~/.cache/expo
                  key: expo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      expo-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Expo prebuild (android)
              run: npx expo prebuild --non-interactive --platform android

            - name: Gradle assembleRelease
              working-directory: android
              env:
                  JAVA_OPTS: -Xmx2g
                  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
              run: ./gradlew assembleRelease --stacktrace

            - name: Upload release APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-release-apk
                  path: android/app/build/outputs/apk/release/*.apk
                  if-no-files-found: error

            # Optional: also build debug variant (uncomment if needed)
            # - name: Gradle assembleDebug
            #   working-directory: android
            #   run: ./gradlew assembleDebug --stacktrace
            # - name: Upload debug APK artifact
            #   uses: actions/upload-artifact@v4
            #   with:
            #     name: app-debug-apk
            #     path: android/app/build/outputs/apk/debug/*.apk
