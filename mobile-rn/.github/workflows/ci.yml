name: CI

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

on:
    pull_request:
    push:
        branches: [master, main]

jobs:
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            android: ${{ steps.filter.outputs.android }}
            native_impact: ${{ steps.filter.outputs.native_impact }}
            app_code: ${{ steps.filter.outputs.app_code }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Detect changed paths
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      android:
                        - 'android/**'
                        - '**/*.gradle*'
                        - 'gradle/wrapper/**'
                        - 'gradle.properties'
                        - 'package-lock.json'
                        - 'app.json'
                        - 'app.config.ts'
                      native_impact:
                        - 'app.json'
                        - 'app.config.*'
                        - 'plugins/**'
                        - 'assets/**'
                        - 'expo-env.d.ts'
                      app_code:
                        - 'src/**/*.ts'
                        - 'src/**/*.tsx'
                        - 'src/**/*.js'
                        - 'src/**/*.jsx'
                        - 'package.json'

    build-and-validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cache ESLint
              uses: actions/cache@v4
              with:
                  path: .cache/eslint
                  key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts','src/**/*.tsx','src/**/*.js','src/**/*.jsx') }}
                  restore-keys: |
                      eslint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

            - name: Cache Prettier
              uses: actions/cache@v4
              with:
                  path: .cache/prettier
                  key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts','src/**/*.tsx','src/**/*.js','src/**/*.jsx','src/**/*.json') }}
                  restore-keys: |
                      prettier-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Prettier check
              run: npm run format:check

            - name: ESLint (fail on warnings)
              run: npm run lint -- --max-warnings=0

            - name: Type check
              run: npm run typecheck

            - name: FSD architecture
              run: npm run fsd:check
              continue-on-error: true

            - name: Tests
              run: npm test -- --ci

    android-build:
        name: Android Build (release APK)
        needs: [build-and-validate, changes]
        # Запускаем сборку если изменились нативные файлы (android), публичные конфиги (native_impact) или прикладной код (app_code)
        if: ${{ needs.changes.outputs.android == 'true' || needs.changes.outputs.native_impact == 'true' || needs.changes.outputs.app_code == 'true' }}
        runs-on: ubuntu-latest
        env:
            EXPO_PUBLIC_WEBVIEW_URL: 'http://91.108.246.148'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            # Expo & dependency caches (do not depend on native android project yet)
            - name: Cache Expo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.expo
                      ~/.cache/expo
                  key: expo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      expo-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: (Advisory) Native drift check
              if: ${{ needs.changes.outputs.native_impact == 'true' }}
              run: bash scripts/native-drift-check.sh || true

            - name: Validate Gradle Wrapper
              # v3 deprecated; moved to maintained action per deprecation guide
              uses: gradle/actions/wrapper-validation@v4

            - name: Setup Java (Temurin 17)
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
            - name: Cache Gradle (wrapper + caches)
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'android/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
                  restore-keys: |
                      gradle-${{ runner.os }}-

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3
              with:
                  # Use API 34 matching explicit ext.compileSdkVersion to avoid failing on not-yet-published 35
                  packages: |
                      platform-tools
                      platforms;android-34
                      build-tools;34.0.0
                  # Не пинним cmdline-tools-version чтобы получить актуальный индекс репозитория и избежать ошибки 'Failed to find package'

            - name: Accept Android licenses (explicit)
              shell: bash
              run: |
                  yes | sdkmanager --licenses >/dev/null || true

            # Диагностика и форсированный ретраи установки нужных пакетов (обход редкого бага sdkmanager с неполным индексом)
            - name: Verify / Retry Android packages
              shell: bash
              env:
                  ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
              run: |
                  set -euo pipefail
                  echo "[diagnostic] sdkmanager path: $(command -v sdkmanager || true)"
                  echo "[diagnostic] Listing currently installed packages (before):"
                  sdkmanager --list_installed || true
                  REQUIRED_PKGS=("platform-tools" "platforms;android-34" "build-tools;34.0.0")
                  MISSING=()
                  for p in "${REQUIRED_PKGS[@]}"; do
                    if ! sdkmanager --list_installed | grep -q "^${p}"; then
                      MISSING+=("$p")
                    fi
                  done
                  if [ ${#MISSING[@]} -eq 0 ]; then
                    echo "All required Android SDK packages already present."
                    exit 0
                  fi
                  echo "Missing packages: ${MISSING[*]}"
                  # Ретраи на случай flaky сети/индекса
                  for attempt in 1 2 3; do
                    echo "Attempt $attempt to install missing packages..."
                    yes | sdkmanager --install "${MISSING[@]}" && break || true
                    sleep 15
                  done
                  # Финальная проверка
                  NOT_FOUND=()
                  for p in "${MISSING[@]}"; do
                    if ! sdkmanager --list_installed | grep -q "^${p}"; then
                      NOT_FOUND+=("$p")
                    fi
                  done
                  if [ ${#NOT_FOUND[@]} -gt 0 ]; then
                    echo "::error::Failed to install Android SDK packages: ${NOT_FOUND[*]}" >&2
                    echo "Available packages snapshot (grep 34 / build-tools):" >&2
                    sdkmanager --list | grep -E 'platforms;android-34|build-tools;34' || true
                    exit 1
                  fi
                  echo "[diagnostic] Installed packages after retry:" 
                  sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-34|build-tools;34.0.0'

            - name: Restore release keystore
              run: |
                  mkdir -p android/app
                  echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > android/app/upload-keystore.jks

            - name: Make gradlew executable
              working-directory: android
              run: chmod +x ./gradlew

            - name: Signing report (diagnostic)
              working-directory: android
              env:
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: upload-keystore.jks
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: ./gradlew :app:signingReport --quiet || true

            - name: Debug signing props
              working-directory: android
              env:
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: upload-keystore.jks
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: ./gradlew :app:properties | grep -i -E 'MYAPP_UPLOAD|signing'

            - name: Gradle assembleRelease
              working-directory: android
              env:
                  JAVA_OPTS: -Xmx2g
                  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.caching=true
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: upload-keystore.jks
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: ./gradlew assembleRelease --stacktrace

            - name: Upload release APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-release-apk
                  path: android/app/build/outputs/apk/release/*.apk
                  if-no-files-found: error

            # Optional: also build debug variant (uncomment if needed)
            # - name: Gradle assembleDebug
            #   working-directory: android
            #   run: ./gradlew assembleDebug --stacktrace
            # - name: Upload debug APK artifact
            #   uses: actions/upload-artifact@v4
            #   with:
            #     name: app-debug-apk
            #     path: android/app/build/outputs/apk/debug/*.apk
