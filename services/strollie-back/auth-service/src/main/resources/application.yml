server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/strollie}
    username: ${POSTGRES_USER:strollie}
    password: ${POSTGRES_PASSWORD:strollie}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:20}
  refresh-token-ttl-hours: ${JWT_REFRESH_TTL_HOURS:24}
  issuer: ${JWT_ISSUER:https://strollie.local}
  private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
  public-key-pem: ${JWT_PUBLIC_KEY_PEM:}

otp:
  ttl-minutes: ${OTP_TTL_MINUTES:10}
  rate-limit-per-hour: ${OTP_RATE_LIMIT_PER_HOUR:3}

mail:
  from: ${MAIL_FROM:noreply@strollie.local}
  subject-otp: ${MAIL_SUBJECT_OTP:Ваш код для входа}