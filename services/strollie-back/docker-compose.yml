version: '3.9'
services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: strollie
      POSTGRES_USER: strollie
      POSTGRES_PASSWORD: strollie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ./auth-service
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/strollie
      POSTGRES_USER: strollie
      POSTGRES_PASSWORD: strollie
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER: https://strollie.local
      # Для dev можно оставить пустые ключи — генерируются на лету
      JWT_PRIVATE_KEY_PEM: ""
      JWT_PUBLIC_KEY_PEM: ""
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    depends_on:
      - postgres
      - redis
      - mailhog
    ports:
      - "8081:8081"

  gateway:
    build:
      context: ./gateway
    environment:
      AUTH_JWKS_URI: http://auth-service:8081/oauth/jwks
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      - auth-service
    ports:
      - "8080:8080"

volumes:
  pgdata: {}